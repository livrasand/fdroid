name: Sync gitGost APK to F-Droid repo

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out fdroid repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve latest android release tag
        id: resolve-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh api repos/livrasand/gitGost/releases \
            --jq '.[].tag_name' \
            | grep '^android/v' \
            | sort -V \
            | tail -1)
          if [ -z "$TAG" ]; then
            echo "No android/v* releases found"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"

      - name: Restore keystore from secret
        env:
          FDROID_KEYSTORE_B64: ${{ secrets.FDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$FDROID_KEYSTORE_B64" ]; then
            echo "FDROID_KEYSTORE_B64 secret is not set"
            exit 1
          fi
          printf '%s' "$FDROID_KEYSTORE_B64" | base64 --decode > keystore.p12
          chmod 600 keystore.p12

      - name: Restore config.yml from secret
        env:
          FDROID_CONFIG_B64: ${{ secrets.FDROID_CONFIG_B64 }}
        run: |
          if [ -z "$FDROID_CONFIG_B64" ]; then
            echo "FDROID_CONFIG_B64 secret is not set"
            exit 1
          fi
          printf '%s' "$FDROID_CONFIG_B64" | base64 --decode > config.yml
          chmod 600 config.yml

      - name: Configure F-Droid repository icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import shutil

          path = Path("config.yml")
          text = path.read_text()
          replacement = "repo_icon: icon.png"
          if re.search(r"^repo_icon:", text, flags=re.MULTILINE):
              text = re.sub(r"^repo_icon:.*$", replacement, text, flags=re.MULTILINE)
          else:
              text = text.rstrip() + "\n" + replacement + "\n"
          path.write_text(text)

          # fdroidserver copies repo_icon from the repo root into
          # repo/icons/<basename>; keep the source outside repo/ to avoid
          # shutil.SameFileError. Use the committed repo icon as the source.
          src = Path("repo/icons/icon.png")
          if src.exists():
              shutil.copyfile(src, Path("icon.png"))
          PY
          chmod 600 config.yml

      - name: Repair repository signing keystore
        env:
          FDROID_KEY_STORE_PASS: ${{ secrets.FDROID_KEY_STORE_PASS }}
        run: |
          set -euo pipefail
          if [ -z "$FDROID_KEY_STORE_PASS" ]; then
            echo "FDROID_KEY_STORE_PASS secret is not set"
            exit 1
          fi
          work_dir="$RUNNER_TEMP/fdroid-keystore"
          mkdir -p "$work_dir"
          python3 - "$work_dir/repo-pubkey.der" <<'PY'
          from pathlib import Path
          import re
          import sys

          index = Path("repo/index.xml").read_text()
          match = re.search(r"<repo\b[^>]*\bpubkey=\"([0-9a-fA-F]+)\"", index)
          if not match:
              raise SystemExit("Repository public key not found in repo/index.xml")
          Path(sys.argv[1]).write_bytes(bytes.fromhex(match.group(1)))
          PY
          openssl x509 -inform DER -in "$work_dir/repo-pubkey.der" -out "$work_dir/repo-cert.pem"
          openssl pkcs12 -in keystore.p12 -nocerts -nodes \
            -passin env:FDROID_KEY_STORE_PASS \
            -out "$work_dir/repo-key.pem"
          openssl pkcs12 -export \
            -inkey "$work_dir/repo-key.pem" \
            -in "$work_dir/repo-cert.pem" \
            -name livrasand \
            -out "$work_dir/keystore.p12" \
            -passout env:FDROID_KEY_STORE_PASS
          mv "$work_dir/keystore.p12" keystore.p12
          chmod 600 keystore.p12

      - name: Set up JDK
        # v5 runs on Node 24 (the current default runtime).
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        run: |
          export ANDROID_SDK_ROOT="$RUNNER_TEMP/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSLo /tmp/cmdtools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "build-tools;34.0.0" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Install fdroidserver
        run: |
          pip install fdroidserver
          fdroid --version

      - name: Sync APK to F-Droid repo
        uses: livrasand/gh-fdroid-release@v1.0.2
        env:
          FDROID_KEY_STORE_PASS: ${{ secrets.FDROID_KEY_STORE_PASS }}
          FDROID_KEY_PASS: ${{ secrets.FDROID_KEY_PASS }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          source: livrasand/gitGost
          apk: "gitgost-android-debug.apk"
          release: ${{ steps.resolve-tag.outputs.tag }}
          repo-directory: repo
          verify-signature: "true"
