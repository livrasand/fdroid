name: Sync gitGost APK to F-Droid repo

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out fdroid repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve latest android release tag
        id: resolve-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh api repos/livrasand/gitGost/releases \
            --jq '.[].tag_name' \
            | grep '^android/v' \
            | sort -V \
            | tail -1)
          if [ -z "$TAG" ]; then
            echo "No android/v* releases found"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"

      - name: Restore keystore from secret
        if: ${{ secrets.FDROID_KEYSTORE_B64 != '' }}
        env:
          FDROID_KEYSTORE_B64: ${{ secrets.FDROID_KEYSTORE_B64 }}
        run: echo "$FDROID_KEYSTORE_B64" | base64 -d > keystore.p12

      - name: Restore config.yml from secret
        if: ${{ secrets.FDROID_CONFIG_B64 != '' }}
        env:
          FDROID_CONFIG_B64: ${{ secrets.FDROID_CONFIG_B64 }}
        run: echo "$FDROID_CONFIG_B64" | base64 -d > config.yml

      - name: Set up JDK
        # v5 runs on Node 24 (the current default runtime).
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        run: |
          export ANDROID_SDK_ROOT="$RUNNER_TEMP/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSLo /tmp/cmdtools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "build-tools;34.0.0" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Install fdroidserver
        run: |
          pip install fdroidserver
          fdroid version

      - name: Sync APK to F-Droid repo
        uses: livrasand/gh-fdroid-release@v1.0.0
        env:
          FDROID_KEY_STORE_PASS: ${{ secrets.FDROID_KEY_STORE_PASS }}
          FDROID_KEY_PASS: ${{ secrets.FDROID_KEY_PASS }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          source: livrasand/gitGost
          apk: "*.apk"
          release: ${{ steps.resolve-tag.outputs.tag }}
          repo-directory: repo
          verify-signature: "true"
